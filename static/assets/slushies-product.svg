<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.4" />
    </radialGradient>
    <linearGradient id="slushGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cupGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f0f9ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="strawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>
  <circle cx="300" cy="300" r="270" fill="url(#bgGlow)" />
  <!-- Straw -->
  <path d="M330 110 L370 60 L410 80 L355 170" fill="none" stroke="url(#strawGradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M330 110 L370 60 L410 80 L355 170" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 14" />
  <!-- Cup Base & Liquid -->
  <path d="M190 220 L220 480 Q225 510 300 510 Q375 510 380 480 L410 220 Z" fill="url(#cupGradient)" stroke="#bae6fd" stroke-width="4" />
  <!-- Frozen Slush Fill -->
  <path d="M200 235 L225 470 Q228 495 300 495 Q372 495 375 470 L400 235 Z" fill="url(#slushGradient)" />
  <!-- Slush Texture / Wave -->
  <ellipse cx="300" cy="235" rx="100" ry="24" fill="#38bdf8" />
  <!-- Slush Dome Top -->
  <path d="M190 225 Q190 140 300 135 Q410 140 410 225 Z" fill="url(#slushGradient)" />
  <ellipse cx="300" cy="180" rx="65" ry="35" fill="#7dd3fc" opacity="0.6" />
  <!-- Ice Crystals & Droplets -->
  <circle cx="280" cy="210" r="5" fill="#ffffff" opacity="0.9" />
  <circle cx="320" cy="190" r="7" fill="#ffffff" opacity="0.8" />
  <circle cx="340" cy="240" r="6" fill="#ffffff" opacity="0.9" />
  <circle cx="250" cy="300" r="8" fill="#ffffff" opacity="0.5" />
  <circle cx="350" cy="360" r="6" fill="#ffffff" opacity="0.6" />
  <!-- Clear Dome Lid -->
  <path d="M175 220 Q175 120 300 115 Q425 120 425 220 Z" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.7" />
  <rect x="170" y="215" width="260" height="15" rx="7" fill="#e0f2fe" stroke="#93c5fd" stroke-width="3" />
  <!-- Label Badge -->
  <rect x="235" y="320" width="130" height="65" rx="12" fill="#0b2b5b" opacity="0.9" />
  <text x="300" y="348" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff">CoolerBox</text>
  <text x="300" y="368" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#38bdf8" letter-spacing="2">SLUSHIES</text>
</svg>
